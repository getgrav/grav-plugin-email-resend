PLUGIN_EMAIL_RESEND:
  PROVIDER_INSTRUCTIONS: "In Resend, open Webhooks and press Add Webhook. Paste in this address and tick email.delivered, email.bounced, email.complained, email.opened, email.clicked, email.failed and email.suppressed. Once it is saved, open the webhook and copy its signing secret — it begins with whsec_ — into the Webhook signing secret field in the Email Resend plugin, because without it every event is refused. Or paste a full-access API key into that plugin and press Set up, which does all of it for you."
  ECHO_NOTE: "Resend sends no message headers back in its webhooks — their words are that a webhook carries the metadata and not the body, the headers or the attachments — so %header% cannot be read at the far end and no setting changes that. Resend does echo the message's tags, so a store that sets a tag named %tag% gets it back on every event; Resend only allows letters, digits, underscores and hyphens in a tag name, which is why it is not spelled like the header. Matching on Message-ID needs none of this and works on every event, because Resend echoes it in full."
