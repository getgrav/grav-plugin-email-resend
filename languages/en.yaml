PLUGIN_EMAIL_RESEND:
  PROVIDER_INSTRUCTIONS: "In Resend, open Webhooks and press Add Webhook. Paste in this address and tick email.delivered, email.bounced, email.complained, email.opened, email.clicked, email.failed and email.suppressed. Once it is saved, open the webhook and copy its signing secret — it begins with whsec_ — into the Webhook signing secret field in the Email Resend plugin, because without it every event is refused. Or paste a full-access API key into that plugin and press Set up, which does all of it for you."
  ECHO_NOTE: "Resend sends no message headers back in its webhooks, so %header% cannot be read at the far end. This plugin copies the send id into a tag named %tag% instead, and Resend returns tags on every event, so there is nothing to set up. Each message is also tagged with the site that sent it, so a site sharing a Resend account with other sites ignores their events."
