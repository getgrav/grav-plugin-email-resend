name: Email Resend
slug: email-resend
type: plugin
version: 1.0.2
testing: false
description: Resend integration for the Email plugin (API and SMTP), with delivery reports
icon: envelope
author:
  name: Team Grav
  email: devs@getgrav.org
homepage: https://github.com/getgrav/grav-plugin-email-resend
keywords: grav, plugin, email, resend, smtp, api
bugs: https://github.com/getgrav/grav-plugin-email-resend/issues
docs: https://github.com/getgrav/grav-plugin-email-resend/blob/develop/README.md
license: MIT

compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: email, version: '>=4.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    transport:
      type: select
      size: small
      label: Transport
      default: api
      help: API is faster and is what Resend recommend. Choose SMTP if your host blocks outbound API calls but allows port 465. Either way the API key below is what authenticates you, so there is no separate SMTP user to create.
      options:
        api: API (faster)
        smtp: SMTP

    api_key:
      type: password
      label: API Key
      help: Your Resend API key, which begins with `re_`. In Resend, open **API Keys** and either copy an existing key or press **Create API Key**. This sends the mail, and it is also what creates the delivery-report webhook and reads your sending domain's DNS back out of Resend — so it is worth filling in on the SMTP transport as well. For the webhook it needs Full access; a Sending access key sends perfectly well and cannot create a webhook.

    reports:
      type: section
      title: Delivery reports
      text: Resend can tell your site what happened to each message after it left — delivered, bounced, marked as spam, opened, clicked. An add-on that records those gives you a web address to register, and this is where the secret that proves the events really came from Resend is kept.

    signing_secret:
      type: password
      label: Webhook signing secret
      help: The secret Resend shows when a webhook is created, which begins with `whsec_`. Press Set up in whichever add-on is showing you the webhook address and this is filled in for you. To do it by hand, open **Webhooks** in Resend, open your webhook and copy the signing secret from there. Without it every delivery event is refused, and nothing on any screen would say why.
